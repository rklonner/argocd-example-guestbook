apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-stages
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: 'https://github.com/rklonner/argocd-example-apps.git'
        revision: HEAD
        directories:
        - path: 'kustomize-guestbook-stages/overlays/*'
        requeueAfterSeconds: 60
  template:
    metadata:
      name: 'guestbook-{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/rklonner/argocd-example-apps.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: 'guestbook-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        syncOptions:
          - CreateNamespace=true
